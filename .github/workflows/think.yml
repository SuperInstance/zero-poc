# think.yml — The Heartbeat (v0.2)
#
# Wakes the agent on schedule. Runs the ReAct agent loop:
# Observe → Think → Act → Observe → ... until done or max iterations.
#
# The agent is autonomous. It doesn't block on human approval.
# Dangerous actions are deferred, not blocked. The human reviews via git log.
#
# Maintainer notes (2026-10-15, see docs/architecture.md):
# - OBSERVED: GitHub throttles this schedule heavily — despite the */15
#   cron below, runs actually fire ~4-5 times/day. Every fired run
#   succeeds; check the Actions tab before blaming the code.
# - fetch-depth: 0 matters: agent.py reads `git log` as memory.
# - id-token: write is what lets us mint the OIDC token for the vault.
# - GH_TOKEN is load-bearing since v0.3: agent.py uses gh with it to
#   list issues (fallback when the vault's list_issues 404s) and to post
#   comments as github-actions[bot] (the react echo-loop fix). The vault
#   still handles everything privileged.
# - The final step pushes to MAIN unconditionally — this is the only push
#   path, and the real enforcement point for "no autonomous workflow
#   edits" (guard 3 of 3; the others are in agent.py).

name: think

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Task for the agent'
        required: false
        type: string
      max_iterations:
        description: 'Max ReAct iterations'
        required: false
        default: '10'
        type: string

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  think:
    runs-on: ubuntu-latest
    steps:
      - name: Check out (the agent's body)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get OIDC token for vault
        # v0.3: token flows via a step output instead of $GITHUB_ENV, so it
        # is scoped to the steps that actually need it rather than
        # persisting in every later step's environment.
        id: oidc
        run: |
          OIDC_TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vault" \
            | jq -r '.value')
          echo "token=${OIDC_TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Shadow gate (observe only — never skips a cycle)
        # Sprint 1: minigate runs here, BEFORE the agent, and records what it
        # WOULD have decided. It has no authority. The verdict reaches exactly
        # one place — .agent-state.json, via SHADOW_GATE — and this step
        # cannot stop the agent below it: no branch, no `if:`, no exit code,
        # and continue-on-error. Nothing downstream reads the verdict yet.
        # Authority is not earned from a shadow log either: an idle stream
        # contains no false-idle to measure, which is why skip authority
        # lives upstream in minigate's selftest, not here.
        id: shadow
        continue-on-error: true
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VAULT_URL: ${{ vars.VAULT_URL }}
        run: |
          RAW=$(python3 - <<'PYEOF'
          import subprocess, sys
          sys.path.insert(0, ".github/scripts")
          out = ""
          try:
              import agent
              # Exactly the digest agent.py would build for itself right now.
              digest = agent.build_gate_digest()
              print(digest, file=sys.stderr)  # keep the digest off stdout
              # Same invocation the upstream selftest uses: digest as argv,
              # cwd = the gate's own directory. gate.py loads gate.json by the
              # RELATIVE path "gate.json", so without cwd it raises
              # FileNotFoundError and every cycle silently falls back to RUN.
              r = subprocess.run(
                  [sys.executable, "gate.py", digest],
                  cwd=".github/scripts/minigate",
                  capture_output=True, text=True, timeout=60)
              # Parse stdout ONLY. A traceback on stderr could contain the
              # literal "SKIP" and fake a skip verdict out of a crash.
              out = r.stdout
              if r.stderr.strip():
                  print("gate stderr: " + r.stderr.strip()[-300:],
                        file=sys.stderr)
          except Exception:
              out = ""
          # gate.py prints "SKIP (idle)", "RUN  (work)" or "RUN  (blind)".
          # Anything unrecognised -> RUN. This step observes; it never skips.
          print("RUN_BLIND" if "(blind)" in out else
                "SKIP" if "SKIP" in out else "RUN")
          PYEOF
          )
          # agent.log() writes to stdout, so the verdict is the LAST line.
          VERDICT=$(printf '%s\n' "$RAW" | tail -n 1)
          case "$VERDICT" in
            RUN|SKIP|RUN_BLIND) ;;
            *) VERDICT=RUN ;;
          esac
          echo "shadow verdict: $VERDICT (agent still runs — observation only)"
          echo "shadow_verdict=$VERDICT" >> "$GITHUB_OUTPUT"

      - name: Run agent loop
        run: python3 .github/scripts/agent.py --task "${{ inputs.task }}" --max-iterations ${{ inputs.max_iterations || '10' }}
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VAULT_URL: ${{ vars.VAULT_URL }}
          SHADOW_GATE: ${{ steps.shadow.outputs.shadow_verdict }}

      - name: Commit everything (memory, scratch, work)
        # The agent's actions only become real here: agent.py commits
        # locally during the loop, but THIS step is what pushes. The
        # `git reset .github/workflows/` is guard 3 of 3 against the
        # agent rewriting its own nervous system (agent.py checks paths
        # and resets before its own commits too). Commit identity is the
        # agent's own ("zero"), distinct from the owner — unlike vault-
        # posted issue comments, which appear as the owner.
        run: |
          git config user.name "zero"
          git config user.email "zero@purplepincher.org"
          git add -A
          git reset .github/workflows/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "think: autonomous cycle $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -m "ReAct loop completed. See MEMORY.md and git log for details."
            git push
          fi
