# think.yml — The Heartbeat (v0.2)
#
# Wakes the agent on schedule. Runs the ReAct agent loop:
# Observe → Think → Act → Observe → ... until done or max iterations.
#
# The agent is autonomous. It doesn't block on human approval.
# Dangerous actions are deferred, not blocked. The human reviews via git log.
#
# Maintainer notes (2026-10-15, see docs/architecture.md):
# - OBSERVED: GitHub throttles this schedule heavily — despite the */15
#   cron below, runs actually fire ~4-5 times/day. Every fired run
#   succeeds; check the Actions tab before blaming the code.
# - fetch-depth: 0 matters: agent.py reads `git log` as memory.
# - id-token: write is what lets us mint the OIDC token for the vault.
# - GH_TOKEN is load-bearing since v0.3: agent.py uses gh with it to
#   list issues (fallback when the vault's list_issues 404s) and to post
#   comments as github-actions[bot] (the react echo-loop fix). The vault
#   still handles everything privileged.
# - The final step pushes to MAIN unconditionally — this is the only push
#   path, and the real enforcement point for "no autonomous workflow
#   edits" (guard 3 of 3; the others are in agent.py).
# - BOARD REPORTS (v0.8): the loop used to finish board work in
#   silence — the human heard nothing unless he asked again
#   (docs/playtest-2026-10-27.md, D1). A "File board reports" step
#   now runs after the loop: it diffs TASKS.md at the cycle's start
#   commit against the working tree, and for every telegram task
#   that moved from "## Open" to "## Done" (or got checked off) it
#   files a small mechanical report in reports/pending/ (cap 5 per
#   cycle, deduped by source-hash against pending/ and delivered/).
#   The commit step below sweeps it in with the rest of the cycle;
#   the telegram workflow delivers pending reports attached to the
#   next reply (see its header). The step can never fail the cycle:
#   any problem prints why and exits 0. Contract: reports/README.md.

name: think

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Task for the agent'
        required: false
        type: string
      max_iterations:
        description: 'Max ReAct iterations'
        required: false
        default: '10'
        type: string

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  think:
    runs-on: ubuntu-latest
    steps:
      - name: Check out (the agent's body)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get OIDC token for vault
        # v0.3: token flows via a step output instead of $GITHUB_ENV, so it
        # is scoped to the steps that actually need it rather than
        # persisting in every later step's environment.
        id: oidc
        run: |
          OIDC_TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vault" \
            | jq -r '.value')
          echo "token=${OIDC_TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Shadow gate (observe only — never skips a cycle)
        # Sprint 1: minigate runs here, BEFORE the agent, and records what it
        # WOULD have decided. It has no authority. The verdict reaches exactly
        # one place — .agent-state.json, via SHADOW_GATE — and this step
        # cannot stop the agent below it: no branch, no `if:`, no exit code,
        # and continue-on-error. Nothing downstream reads the verdict yet.
        # Authority is not earned from a shadow log either: an idle stream
        # contains no false-idle to measure, which is why skip authority
        # lives upstream in minigate's selftest, not here.
        id: shadow
        continue-on-error: true
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VAULT_URL: ${{ vars.VAULT_URL }}
        run: |
          RAW=$(python3 - <<'PYEOF'
          import subprocess, sys
          sys.path.insert(0, ".github/scripts")
          out = ""
          try:
              import agent
              # Exactly the digest agent.py would build for itself right now.
              digest = agent.build_gate_digest()
              print(digest, file=sys.stderr)  # keep the digest off stdout
              # Same invocation the upstream selftest uses: digest as argv,
              # cwd = the gate's own directory. gate.py loads gate.json by the
              # RELATIVE path "gate.json", so without cwd it raises
              # FileNotFoundError and every cycle silently falls back to RUN.
              r = subprocess.run(
                  [sys.executable, "gate.py", digest],
                  cwd=".github/scripts/minigate",
                  capture_output=True, text=True, timeout=60)
              # Parse stdout ONLY. A traceback on stderr could contain the
              # literal "SKIP" and fake a skip verdict out of a crash.
              out = r.stdout
              if r.stderr.strip():
                  print("gate stderr: " + r.stderr.strip()[-300:],
                        file=sys.stderr)
          except Exception:
              out = ""
          # gate.py prints "SKIP (idle)", "RUN  (work)" or "RUN  (blind)".
          # Anything unrecognised -> RUN. This step observes; it never skips.
          print("RUN_BLIND" if "(blind)" in out else
                "SKIP" if "SKIP" in out else "RUN")
          PYEOF
          )
          # agent.log() writes to stdout, so the verdict is the LAST line.
          VERDICT=$(printf '%s\n' "$RAW" | tail -n 1)
          case "$VERDICT" in
            RUN|SKIP|RUN_BLIND) ;;
            *) VERDICT=RUN ;;
          esac
          echo "shadow verdict: $VERDICT (agent still runs — observation only)"
          echo "shadow_verdict=$VERDICT" >> "$GITHUB_OUTPUT"

      - name: Run agent loop
        run: python3 .github/scripts/agent.py --task "${{ inputs.task }}" --max-iterations ${{ inputs.max_iterations || '10' }}
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VAULT_URL: ${{ vars.VAULT_URL }}
          SHADOW_GATE: ${{ steps.shadow.outputs.shadow_verdict }}
          # Cloud gate (TypeSafe Jev). INERT until the repo secret
          # TYPESAFE_API_KEY exists — with no key, decide() uses the
          # local Ollaya path and the gate stays dormant as today.
          # Bench: gate-replay/JEV-RESULTS.md (95% skip, $0.05/mo).
          DECISION_URL: https://api.typesafe.ai
          DECISION_MODEL: jev-preview
          DECISION_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

      - name: File board reports
        # v0.8 producer (see the BOARD REPORTS header note; contract in
        # reports/README.md). Baseline is the commit this cycle checked
        # out (CYCLE_BASE = github.sha), falling back to HEAD: agent.py's
        # git_commit tool commits DURING the loop, so by now HEAD may
        # already contain the closure and a HEAD-vs-tree diff would miss
        # it. Content reaches python via env/files only. A reports
        # failure must never fail the think cycle: continue-on-error,
        # and every error path prints why and exits 0.
        continue-on-error: true
        env:
          CYCLE_BASE: ${{ github.sha }}
        run: |
          python3 - <<'PY' || echo "board reports: producer error ignored"
          import datetime, hashlib, os, pathlib, re, subprocess, sys
          def done(why):
              print("board reports: " + why)
              sys.exit(0)
          try:
              new_p = pathlib.Path("TASKS.md")
              if not new_p.exists():
                  done("no TASKS.md - nothing to report")
              base = os.environ.get("CYCLE_BASE", "").strip() or "HEAD"
              r = subprocess.run(["git", "show", f"{base}:TASKS.md"],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  done(f"git show {base}:TASKS.md failed - nothing to report")
              old, new = r.stdout, new_p.read_text()
              if old == new:
                  done("TASKS.md unchanged - nothing to report")
              # Identity text: the task line, checkbox marker stripped,
              # whitespace collapsed.
              MARK = re.compile(r"^- \[[ xX]\]\s*")
              def ident(line):
                  return " ".join(MARK.sub("", line, count=1).split())
              def sections(text):
                  out, cur = {}, None
                  for line in text.splitlines():
                      if line.startswith("## "):
                          cur = line[3:].strip()
                          out.setdefault(cur, [])
                      elif line.startswith("- ["):
                          out.setdefault(cur, []).append(line)
                  return out
              old_s, new_s = sections(old), sections(new)
              closed_now = {ident(l) for l in new_s.get("Done", [])}
              closed_now |= {ident(l) for ls in new_s.values() for l in ls
                             if l.lower().startswith("- [x]")}
              # Dedup: any source-hash already filed, pending or delivered.
              rdir = pathlib.Path("reports")
              seen = set()
              for sub in ("pending", "delivered"):
                  d = rdir / sub
                  if d.is_dir():
                      for f in d.iterdir():
                          if f.is_file():
                              m = re.search(r"^source-hash:\s*([0-9a-f]+)\s*$",
                                            f.read_text(errors="replace"), re.M)
                              if m:
                                  seen.add(m.group(1))
              closed = []
              for line in old_s.get("Open", []):
                  t = ident(line)
                  if "(telegram" not in t or t not in closed_now:
                      continue
                  h = hashlib.sha1(t.encode()).hexdigest()[:12]
                  if h in seen:
                      continue
                  seen.add(h)
                  closed.append((t, h))
                  if len(closed) >= 5:
                      break
              if not closed:
                  done("no newly closed telegram tasks")
              pend = rdir / "pending"
              pend.mkdir(parents=True, exist_ok=True)
              now = datetime.datetime.now(datetime.timezone.utc)
              stamp = now.strftime("%Y-%m-%dT%H%M%SZ")
              at = now.strftime("%Y-%m-%dT%H:%M:%SZ")
              for i, (t, h) in enumerate(closed, 1):
                  # Collision suffix like conversation/: -2, -3, ...
                  base_name, n = f"{stamp}-{i}", 1
                  name = base_name
                  while (pend / f"{name}.md").exists():
                      n += 1
                      name = f"{base_name}-{n}"
                  body = f'Closed on the board: "{t[:300]}".'
                  (pend / f"{name}.md").write_text(
                      f"---\nfrom: think-loop\nat: {at}\nkind: mechanical\n"
                      f"source-hash: {h}\ntask: {t}\n---\n\n{body}\n")
                  print(f"board reports: filed {name}.md ({h})")
          except SystemExit:
              raise
          except Exception as e:
              done(f"producer error ignored: {e!r}")
          PY

      - name: Commit everything (memory, scratch, work)
        # The agent's actions only become real here: agent.py commits
        # locally during the loop, but THIS step is what pushes. The
        # `git reset .github/workflows/` is guard 3 of 3 against the
        # agent rewriting its own nervous system (agent.py checks paths
        # and resets before its own commits too). Commit identity is the
        # agent's own ("zero"), distinct from the owner — unlike vault-
        # posted issue comments, which appear as the owner.
        run: |
          git config user.name "zero"
          git config user.email "zero@purplepincher.org"
          git add -A
          git reset .github/workflows/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "think: autonomous cycle $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -m "ReAct loop completed. See MEMORY.md and git log for details."
            git push
          fi
