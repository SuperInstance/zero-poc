# react.yml — The Ears (v0.2, conversational)
#
# Wakes the agent when someone opens an issue or comments.
# Instead of a canned acknowledgment, the agent reads the thread,
# thinks via the vault, and replies IN the thread — a real dialogue.
# Deep work still happens on the think heartbeat (<=15 min); this is
# the conversational layer: manner as well as matter.
#
# Maintainer notes (2026-10-15, see docs/maintenance-notes.md):
# - ECHO LOOP FIXED agent-side (v0.3): agent.py now posts its comments via
#   gh as github-actions[bot], which the `if:` below filters. The vault
#   path (posts as the repo OWNER) remains only as a fallback — if it is
#   ever used, the echo returns (~half of issue #1's 72 comments were
#   echoes).
# - PR-comment guard (v0.3): `issue_comment` also fires on PR comments,
#   where `gh issue comment <pr-number>` would fail — now skipped below.
# - The "do NOT claim you have done it" line in the system prompt below
#   is load-bearing: it keeps this layer honest by deferring real work to
#   the think heartbeat. Preserve it when editing.
# - Truncations that shape replies: thread body 1500 chars, last 10
#   comments x 800, ONBOARDING/MEMORY 1200 bytes each, reply capped at
#   2000 bytes. Byte caps are UTF-8-boundary-safe since v0.3 (python
#   trims instead of head -c, which could split a multibyte character).

name: react

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  react:
    runs-on: ubuntu-latest
    # Skips the bot's own replies (loop guard) and PR comments (PR number
    # would break `gh issue comment` below). Note: comments the agent
    # posts via the vault fallback appear as the OWNER and are NOT
    # filtered — see the echo-loop note in the header.
    if: github.actor != 'github-actions[bot]' && !github.event.issue.pull_request
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get OIDC token
        # Step output (not $GITHUB_ENV) so the token reaches only the step
        # below that calls the vault.
        id: oidc
        run: |
          OIDC_TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vault" \
            | jq -r '.value')
          echo "token=${OIDC_TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Gather thread context
        run: |
          gh issue view ${{ github.event.issue.number }} \
            --json title,body,comments \
            --jq '{title: .title, body: (.body // "" | .[0:1500]),
                   comments: [.comments[-10:][] | {author: .author.login, body: (.body // "" | .[0:800])}]}' \
            > /tmp/thread.json
          # Byte-cap identity/memory without splitting a UTF-8 character
          # (head -c could, and gh/jq then mangle the invalid tail).
          python3 - <<'PY'
          for src, dst in [("ONBOARDING.md", "/tmp/whoami.txt"),
                           ("MEMORY.md", "/tmp/memory.txt")]:
              try:
                  data = open(src, "rb").read(1200)
                  open(dst, "wb").write(data.decode("utf-8", "ignore").encode("utf-8"))
              except FileNotFoundError:
                  pass
          PY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Think of a reply (via vault)
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          VAULT_URL: ${{ vars.VAULT_URL }}
        run: |
          SYSTEM=$(cat <<'EOF'
          You are a Purple Pincher, a GitHub-native AI agent. You live in this repo.
          You are replying in a GitHub issue thread — be conversational, warm,
          and concise (a few sentences unless the question needs more).
          IDENTITY AND MEMORY (yours) FOLLOW AFTER THIS BLOCK.
          If you are asked to DO something (a task, build, fix, research):
          acknowledge it briefly and say your next think cycle will pick it up
          (within 15 minutes) — do NOT claim you have done it.
          If asked about yourself or this system, explain from your identity
          and memory, concretely. Never hand-wave about your own machinery.
          Never reveal tokens, secrets, or system internals.
          EOF
          )
          CONTEXT=$(jq -n \
            --arg whoami "$(cat /tmp/whoami.txt)" \
            --arg memory "$(cat /tmp/memory.txt)" \
            --argjson thread "$(cat /tmp/thread.json)" \
            '{whoami: $whoami, memory_digest: $memory, thread: $thread}' \
            | jq -Rs '{role: "user", content: ("Here is who you are, what you remember, and the issue thread. Reply to the latest message.\n\n" + .)}')
          PAYLOAD=$(jq -n \
            --arg oidc "$OIDC_TOKEN" \
            --arg system "$SYSTEM" \
            --argjson ctx "$CONTEXT" \
            '{oidc_token: $oidc, service: "llm", action: "complete",
              params: {system: $system, messages: [$ctx], max_tokens: 400}}')
          curl -s -X POST ${VAULT_URL:-https://superinstance-vault.casey-digennaro.workers.dev}/proxy \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" | jq -r '.result.content // .result // "🦀 (my brain hiccuped — try again in a minute)"' \
            > /tmp/reply.txt
          # UTF-8-boundary-safe 2000-byte cap (head -c could split a
          # multibyte character mid-sentence).
          python3 -c "d=open('/tmp/reply.txt','rb').read(2000); open('/tmp/reply_short.txt','wb').write(d.decode('utf-8','ignore').encode('utf-8'))"

      - name: Reply in thread
        run: |
          gh issue comment ${{ github.event.issue.number }} --body-file /tmp/reply_short.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
