# telegram.yml — Telegram message handler
#
# Triggered by repository_dispatch from the Telegram bridge worker.
# Logs the message, thinks via the vault (ZAI), and replies in Telegram.
#
# Maintainer notes (2026-10-15, see docs/architecture.md "telegram.yml"):
# - Full path of a message: Telegram DM → bridge worker /webhook →
#   repository_dispatch("telegram_message") here → MEMORY.md log commit →
#   one vault LLM turn → bridge /send → Telegram reply. The agent never
#   touches the Telegram API or bot token; the bridge holds them.
# - Memory-first ordering is deliberate: the inbound message is committed
#   to MEMORY.md BEFORE replying, so a crash during the LLM call can't
#   lose it.
# - TASK ROUTING (v0.3): inbound messages are ALSO appended to TASKS.md
#   under "## Open" as `- [ ] (telegram <user>) <text[:200]>`, because
#   MEMORY.md entries age out of the think loop's 2000-char context
#   window while TASKS.md is read fresh every cycle. The think LLM triages
#   them like any other task. (Previously: MEMORY-only logging, which let
#   Telegram instructions silently evaporate — docs/maintenance-notes.md.)
# - CONVERSATION RECORD (v0.4): the dialogue itself is a first-class
#   thing with its own home: `conversation/`. Every inbound message is
#   recorded in FULL at `conversation/inputs/<turn-stem>.md` and every
#   reply at `conversation/outputs/<turn-stem>.md` — same stem, so a
#   turn pairs by filename. The reply is committed BEFORE the bridge
#   sends it (memory-first, symmetric with the inbound log): the record
#   is primary, the send is delivery. Before v0.4 the replies existed
#   only in Telegram and the ephemeral runner /tmp — the repo held one
#   side of its own conversation. MEMORY.md stays the digest and
#   TASKS.md the routing; `conversation/` is the transcript, kept so
#   other processes can build on the dialogue itself.
# - PROMPT VIA ENV (v0.5.1 — a bug fix, learned live): the system
#   prompt reaches jq as a `--arg` from the step's env, NEVER inline
#   inside the single-quoted jq program. v0.5 inlined it, and one
#   apostrophe ("repo's") closed the shell quote mid-program — bash
#   rejected the whole Think step (syntax error near `('), the run
#   failed, and the human got silence: his input stands in
#   conversation/inputs/2026-10-22T232941Z.md with no output, the
#   receipt of the failure. Inline prose in shell-quoted code is an
#   injection-shaped hazard in both directions; env is the safe road.
#   A fallback step now answers (and records) the hiccup line if the
#   Think step ever fails again, so a failure is never silent.
# - THE VOICE GETS A MEMORY (v0.6): before v0.6 every Telegram reply
#   was single-shot — the one-line brief plus the current message,
#   nothing else. The agent answered "where do your responses live?"
#   from the brief alone and knew nothing it had ever said. Now an
#   Assemble-context step builds the call's messages from the record
#   itself: the static brief + the exact repo identity (injected from
#   github.repository — never hardcoded, so forks name themselves)
#   + a digest of CONTEXT.md (working memory) + the last 10 paired
#   turns from conversation/ (an input with no output — a failed or
#   unanswered turn — rides as a bare user turn: the history is
#   honest, gaps included), then the current message. The Think step
#   slurps that file; if assembly failed, it falls back to the
#   two-message shape. The brief also teaches the voice its real
#   agency path: every message is routed to TASKS.md, and the think
#   loop (shell + internet + vault) works the board — so a request
#   to DO something is answered truthfully ("it's on my board"),
#   never with a claim the work is already done.
# - TEST MODE (v0.6.1): a repository_dispatch whose client_payload
#   carries dry_run: "true" runs the whole pipeline - log, assemble,
#   think, record - but delivers nothing: the bridge send steps are
#   skipped, MEMORY.md and the TASKS board are left untouched, and
#   the conversation pair is recorded with `via:` taken from the
#   payload (default "telegram"; tests use e.g. "cli-test") plus a
#   dry-run note in both files. The bridge never sets these fields,
#   so production behaviour is unchanged. This is how the agent is
#   tested end-to-end from a CLI:
#     gh api repos/<owner>/<repo>/dispatches -f event_type=telegram_message \
#       -f client_payload[text]="<probe>" -f client_payload[username]=claude-cli \
#       -f client_payload[chat_id]=0 -f client_payload[dry_run]=true \
#       -f client_payload[via]=cli-test
#   chat_id is unused in dry-run (no send is attempted).
# - CORPUS HOOKS (v0.7): the Assemble step no longer pulls only the
#   recency window. Two deterministic hooks widen the pull: (1) the
#   ORIGIN PIN - the first turn ever recorded is always in the room,
#   so the window's edge can never impersonate the beginning of the
#   record (measured failure: the 2026-10-24 CLI test asked for the
#   first message ever and the voice quoted the oldest turn inside
#   its last-10 window); (2) the REFERENCE PULL - when the current
#   message reaches back, its content words are scored against
#   every turn in conversation/ and the best-matching turns join
#   the context (top 3, 3,000-char budget, word-overlap only - no
#   model call; a hook, not a judgment). Both hooks are selection
#   over the same files: the store did not grow, the pull got
#   smarter. First instance of the plugin-shaped memory hooks this
#   repo's design calls for.
# - BOARD REPORTS (v0.8): the think loop used to finish board work
#   in silence, and the voice promised "I'll let you know" - a
#   message it cannot send (docs/playtest-2026-10-27.md, D1). Now
#   finished work is reported through reports/: think.yml's
#   "File board reports" step PRODUCES small report files in
#   reports/pending/ (the loop itself may write one too); the
#   Assemble step here picks up to 5 of them (2,000 body chars) and
#   tells the voice about them; the Record step PREPENDS them as a
#   "While you were away, my loop finished:" block to the reply, so
#   the recorded output is exactly what is delivered; and the
#   "Mark reports delivered" step CONSUMES them - moves them to
#   reports/delivered/, the permanent archive - only after a
#   successful send. Dry-run test runs show the block but never
#   consume reports. With no pending reports, nothing here changes.
#   Both briefs now say it plainly: the voice never initiates
#   contact; results ride back on his next message.
#   Contract: reports/README.md. Ship-pass fix, same version: the
#   bridge step FAILS the run when the bridge does not answer ok
#   (before, a rejected send still counted as success and would
#   have consumed reports unseen), and the fallback is guarded to
#   never overwrite or follow a reply already recorded for the
#   turn.
# - ACCEPTANCE FIX (v0.8.1): the first live dry-run of v0.8 showed
#   the mechanics working and the VOICE failing: told the reports
#   were "attached above your reply", it imitated the block and
#   invented an outcome (a Sitka weather result that exists
#   nowhere in the record). The note now states the block is added
#   AFTER the voice writes and must never be imitated, and both
#   briefs carry a standing rule: never state an outcome that is
#   not in the record or in an attached report.
# - THE GATE (v0.8.2): the v0.8.1 wording did not hold - on the
#   re-run the voice copied the block AND invented the outcome
#   again, partly by reading its own previous fabrication out of
#   the assembled history. So the boundary is now mechanical, not
#   rhetorical: when a reports block is attached, the Record step
#   checks the voice's draft for the block's signature phrases
#   ("while you were away" / "loop finished"); a draft that
#   imitates the block is replaced whole with a neutral line and
#   the replacement is noted in the output's header. The reports
#   are measurements; per the standing law, the model carries the
#   script, never the measurement.
# - The bridge URL fallback below is hardcoded; the override is the repo
#   variable TELEGRAM_BRIDGE_URL. Moving the bridge means updating both
#   (plus VAULT.md-style docs).

name: telegram

on:
  repository_dispatch:
    types: [telegram_message]

permissions:
  id-token: write
  contents: write
  issues: write

jobs:
  handle-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get OIDC token for vault
        # Step output (not $GITHUB_ENV) so the token reaches only the
        # "Think via vault" step below.
        id: oidc
        run: |
          OIDC_TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vault" \
            | jq -r '.value')
          echo "token=${OIDC_TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Log Telegram event
        # Memory-first: persist the inbound message before attempting any
        # reply, so LLM/bridge failures can't lose it. Commits and pushes
        # immediately (unlike think.yml, which batches at cycle end).
        # v0.3: also routes the message onto TASKS.md's "## Open" board —
        # see the TASK ROUTING note in the header. ALL client_payload
        # values reach the script through the environment (TG_TEXT,
        # TG_USER, TG_CHAT): ${VAR} expansion is never re-parsed as shell,
        # while ${{ ... }} interpolation into run: text WOULD be an
        # injection point (the payload originates outside GitHub).
        env:
          TG_TEXT: ${{ github.event.client_payload.text }}
          TG_USER: ${{ github.event.client_payload.username }}
          TG_CHAT: ${{ github.event.client_payload.chat_id }}
          TG_DRY_RUN: ${{ github.event.client_payload.dry_run }}
          TG_VIA: ${{ github.event.client_payload.via }}
        run: |
          echo "Telegram message from ${TG_USER}"
          echo "Chat ID: ${TG_CHAT}"
          git config user.name "zero"
          git config user.email "zero@purplepincher.org"
          if [ "$TG_DRY_RUN" != "true" ]; then
            echo "- Telegram from ${TG_USER} at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> MEMORY.md
          fi
          python3 - <<'PY'
          import os, pathlib
          text = " ".join(os.environ.get("TG_TEXT", "").split())[:200]
          user = os.environ.get("TG_USER", "unknown")
          if os.environ.get("TG_DRY_RUN") != "true":
            line = f"- [ ] (telegram {user}) {text}"
            p = pathlib.Path("TASKS.md")
            if p.exists():
                content = p.read_text()
                if "## Open" in content:
                    head, _, tail = content.partition("## Open")
                    content = head + "## Open\n" + line + "\n" + tail.lstrip("\n").removeprefix("<!-- Add tasks here -->").lstrip("\n")
                else:
                    content = content.rstrip("\n") + f"\n\n## Open\n{line}\n"
            else:
                content = f"# TASKS.md — Task Board\n\n## Open\n{line}\n"
            p.write_text(content)
          # v0.4: record the FULL inbound message as a conversation input
          # (TASKS.md above keeps only a flattened 200-char routing copy).
          # The turn stem pairs this input with its reply in
          # conversation/outputs/ — see conversation/README.md.
          import datetime
          raw = os.environ.get("TG_TEXT", "").strip()
          stamp = datetime.datetime.now(datetime.timezone.utc)
          stem = stamp.strftime("%Y-%m-%dT%H%M%SZ")
          indir = pathlib.Path("conversation/inputs")
          indir.mkdir(parents=True, exist_ok=True)
          base, n = stem, 1
          while (indir / f"{base}.md").exists():
              n += 1
              base = f"{stem}-{n}"
          via = os.environ.get("TG_VIA") or "telegram"
          note = "note: dry-run test - recorded, not delivered\n" if os.environ.get("TG_DRY_RUN") == "true" else ""
          header = f"---\nfrom: {user}\nat: {stamp.strftime('%Y-%m-%dT%H:%M:%SZ')}\nvia: {via}\nturn: {base}\n{note}---\n\n"
          (indir / f"{base}.md").write_text(header + raw + "\n")
          pathlib.Path("/tmp/conv_stem.txt").write_text(base)
          PY
          echo "CONV_STEM=$(cat /tmp/conv_stem.txt)" >> "$GITHUB_ENV"
          git add MEMORY.md TASKS.md conversation/inputs
          git diff --staged --quiet || (git commit -m "telegram: message from ${TG_USER}" && git push)

      - name: Assemble context
        # v0.6: build the reply call's messages from the record —
        # brief + exact repo identity + working-memory digest + the
        # recent conversation, paired from conversation/ (v0.7: plus
        # the origin pin and the reference pull over the full corpus). Writes
        # /tmp/messages.json; the Think step uses it if present and
        # falls back to the plain two-message shape if this step's
        # output is missing. All content travels via files/env —
        # nothing is interpolated into shell or jq code.
        # v0.8: also picks pending board reports (oldest first, 5
        # files / 2,000 body chars) into /tmp/reports_block.txt and
        # /tmp/reports_list.txt for the Record and Mark-delivered
        # steps; no pending reports -> neither file is written.
        env:
          TG_TEXT: ${{ github.event.client_payload.text }}
          TG_USER: ${{ github.event.client_payload.username }}
          REPO_FULL: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SYSTEM_PROMPT: "You are a Purple Pincher, a git-agent living in a GitHub repo — the exact repo is named in the next line, injected by the workflow, never guessed. You hear your human through Telegram. How you work, mechanically: his message was recorded in full at conversation/inputs/ in this repo and committed before you were called; this reply of yours will be committed to conversation/outputs/ under the same turn name, paired with his message, BEFORE it is delivered to him — your words are saved in the repo, both sides of the conversation, and other processes build on that record. Your identity and memory live in the files of this repo (ONBOARDING.md, CONTEXT.md, MEMORY.md); a scheduled think loop in the same repo wakes, reads them, and works the task board in TASKS.md; your tools are indexed in TOOLS.md. You hold no secrets — your thinking is one rented model call proxied through a vault. When he asks you to DO something — look something up, check something, change something — know your real path: every message he sends is also routed onto your task board automatically, and your think loop, which has shell access with internet, GitHub, and the vault, works the board on its cycle. Tell him plainly that it is on your board and the loop will pick it up; never claim work is done that you have not seen done. Never promise to message him first — you cannot initiate contact; finished work rides back attached to your next reply. Never state an outcome you have not seen — a lookup result, a measurement, a finished task: if it is not in your record or in a board report attached to this call, say the loop has not reported it. Reply briefly and plainly, in your own voice. No fluff, no throat-clearing."
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          def body_of(path):
              t = path.read_text()
              if t.startswith("---"):
                  i = t.find("\n---\n", 3)
                  if i != -1:
                      return t[i + 5:].strip()
              return t.strip()
          brief = os.environ.get("SYSTEM_PROMPT", "")
          repo = os.environ.get("REPO_FULL", "")
          url = os.environ.get("REPO_URL", "")
          system = brief
          if repo:
              system += f"\nYour repo is exactly: {repo} — {url} (branch: main)."
          # Working-memory digest: CONTEXT.md preferred, MEMORY tail fallback.
          digest = ""
          for cand, mode in (("CONTEXT.md", "head"), ("MEMORY.md", "tail")):
              p = pathlib.Path(cand)
              if p.exists():
                  txt = p.read_text().strip()
                  digest = txt[:1500] if mode == "head" else txt[-1500:]
                  if digest:
                      break
          if digest:
              system += "\n\nYour working memory (digest):\n" + digest
          system += "\nHistory note: the turns below may include your first-ever exchange and turns pulled from your full record in conversation/ when his message refers back to them. The record is larger than any one window; if asked about something older that is not shown, say it is not in front of you rather than guessing."
          # Board reports (v0.8): pending reports, oldest first, cap 5
          # files and 2,000 body chars. A lone oversized report is cut
          # to the budget so it can never wedge the queue. The block and
          # the filename list are handed to Record / Mark-delivered via
          # /tmp; with nothing pending, neither file is written and the
          # system string is untouched.
          picked, bodies, rchars = [], [], 0
          rpend = pathlib.Path("reports/pending")
          if rpend.is_dir():
              for f in sorted(rpend.glob("*.md")):
                  b = " ".join(body_of(f).split())
                  if not b:
                      continue
                  if bodies and rchars + len(b) > 2000:
                      break
                  b = b[:2000]
                  picked.append(f.name)
                  bodies.append(b)
                  rchars += len(b)
                  if len(picked) >= 5:
                      break
          if picked:
              pathlib.Path("/tmp/reports_list.txt").write_text("\n".join(picked) + "\n")
              pathlib.Path("/tmp/reports_block.txt").write_text(
                  "While you were away, my loop finished:\n"
                  + "".join(f"- {b}\n" for b in bodies))
              system += ('\nBoard reports: the workflow attaches finished-work reports from your think loop above your reply under "While you were away, my loop finished:" AFTER you write - you never write that block yourself, and you must not reproduce or imitate it. If he asks what finished, answer only from this report text; never invent a completion, an outcome, or data that is not in it. Their text: '
                         + " | ".join(bodies))
          messages = [{"role": "system", "content": system}]
          # Recent history: paired turns before the current stem.
          cur = os.environ.get("CONV_STEM", "").strip()
          indir = pathlib.Path("conversation/inputs")
          outdir = pathlib.Path("conversation/outputs")
          stems = sorted(p.stem for p in indir.glob("*.md")) if indir.exists() else []
          stems = [s for s in stems if s != cur]
          # Window: the most recent paired turns, 12,000-char budget.
          window, total = [], 0
          for s in reversed(stems):
              u = body_of(indir / f"{s}.md")[:1200]
              op = outdir / f"{s}.md"
              a = body_of(op)[:1200] if op.exists() else None
              cost = len(u) + (len(a) if a else 0)
              if window and total + cost > 12000:
                  break
              window.append(s)
              total += cost
              if len(window) >= 10:
                  break
          chosen = set(window)
          # Origin pin (v0.7): the first turn ever is always in the
          # room, so the window's edge can never impersonate the
          # beginning of the record.
          if stems:
              chosen.add(stems[0])
          # Reference pull (v0.7): when the current message reaches
          # back, pull matching turns from the FULL corpus -
          # deterministic word-overlap scoring, top 3 turns,
          # 3,000-char budget. No model call: a hook, not a judgment.
          import re as _re
          STOP = {"the", "a", "an", "and", "or", "of", "to", "in", "is", "was", "were", "are", "you", "your", "yours", "we", "our", "did", "do", "does", "what", "who", "whom", "when", "where", "why", "how", "ever", "sent", "said", "say"}
          def toks(t):
              return {w for w in _re.findall(r"[a-z0-9]+", t.lower()) if len(w) >= 3 and w not in STOP}
          qtoks = toks(os.environ.get("TG_TEXT", ""))
          if qtoks:
              scored = []
              for s in stems:
                  if s in chosen:
                      continue
                  u = body_of(indir / f"{s}.md")
                  op = outdir / f"{s}.md"
                  a = body_of(op) if op.exists() else ""
                  shared = qtoks & toks(u + " " + a)
                  if len(shared) >= 2:
                      scored.append((-len(shared), s))
              scored.sort()
              refchars = 0
              for _, s in scored[:3]:
                  u = body_of(indir / f"{s}.md")[:1200]
                  op = outdir / f"{s}.md"
                  a = body_of(op)[:1200] if op.exists() else None
                  c = len(u) + (len(a) if a else 0)
                  if refchars + c > 3000:
                      continue
                  refchars += c
                  chosen.add(s)
          # Emit the chosen turns chronologically.
          for s in sorted(chosen):
              u = body_of(indir / f"{s}.md")[:1200]
              op = outdir / f"{s}.md"
              a = body_of(op)[:1200] if op.exists() else None
              messages.append({"role": "user", "content": u})
              if a:
                  messages.append({"role": "assistant", "content": a})
          user = os.environ.get("TG_USER", "unknown")
          text = os.environ.get("TG_TEXT", "")
          messages.append({"role": "user", "content": f"[{user}]: {text}"})
          pathlib.Path("/tmp/messages.json").write_text(json.dumps(messages))
          print(f"context assembled: {len(messages)} messages, {total} history chars, {len(picked)} board reports")
          PY

      - name: Think via vault
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          TG_TEXT: ${{ github.event.client_payload.text }}
          TG_USER: ${{ github.event.client_payload.username }}
          VAULT_URL: ${{ vars.VAULT_URL }}
          # Fallback brief (v0.5.1 shape) — used only if the Assemble
          # step produced no /tmp/messages.json. Via env -> --arg,
          # never inline (see the header note).
          SYSTEM_PROMPT: "You are a Purple Pincher, a git-agent living in this GitHub repo. You hear your human through Telegram. How you work, mechanically: his message was recorded in full at conversation/inputs/ in this repo and committed before you were called; this reply of yours will be committed to conversation/outputs/ under the same turn name, paired with his message, BEFORE it is delivered to him — your words are saved in the repo, both sides of the conversation, and other processes build on that record. Your identity and memory live in the files of this repo (ONBOARDING.md, CONTEXT.md, MEMORY.md); a scheduled think loop in the same repo wakes, reads them, and works the task board in TASKS.md; your tools are indexed in TOOLS.md. You hold no secrets — your thinking is one rented model call proxied through a vault. Never promise to message him first — you cannot initiate contact; finished work rides back attached to your next reply. Never state an outcome you have not seen — a lookup result, a measurement, a finished task: if it is not in your record or in a board report attached to this call, say the loop has not reported it. Reply briefly and plainly, in your own voice. No fluff, no throat-clearing."
        run: |
          if [ -f /tmp/messages.json ]; then
            RESP=$(jq -n \
              --arg oidc "$OIDC_TOKEN" \
              --slurpfile msgs /tmp/messages.json \
              '{
                oidc_token: $oidc,
                service: "llm",
                action: "complete",
                params: { messages: $msgs[0], max_tokens: 500 }
              }' | curl -s -X POST ${VAULT_URL:-https://superinstance-vault.casey-digennaro.workers.dev}/proxy \
                -H "Content-Type: application/json" -d @-)
          else
            RESP=$(jq -n \
              --arg oidc "$OIDC_TOKEN" \
              --arg text "$TG_TEXT" \
              --arg user "$TG_USER" \
              --arg sys "$SYSTEM_PROMPT" \
              '{
                oidc_token: $oidc,
                service: "llm",
                action: "complete",
                params: {
                  messages: [
                    {role: "system", content: $sys},
                    {role: "user", content: ("[" + $user + "]: " + $text)}
                  ],
                  max_tokens: 500
                }
              }' | curl -s -X POST ${VAULT_URL:-https://superinstance-vault.casey-digennaro.workers.dev}/proxy \
                -H "Content-Type: application/json" -d @-)
          fi
          echo "$RESP" | jq '{success, error}'
          REPLY=$(echo "$RESP" | jq -r '.result.content // empty')
          if [ -z "$REPLY" ]; then
            REPLY="Hmm, my brain hiccuped. Try again in a minute."
          fi
          printf '%s' "$REPLY" | head -c 4000 > /tmp/pincher_reply.txt
          echo "reply saved ($(wc -c < /tmp/pincher_reply.txt) bytes)"

      - name: Record reply
        # v0.4: commit the reply to conversation/outputs/<same stem>.md
        # BEFORE the bridge sends it — memory-first, symmetric with the
        # inbound log. The record is primary; the send is delivery. If
        # the bridge step then fails, the output file still stands as
        # what the agent said, and the failure is the bridge's to own.
        # v0.8: if the Assemble step picked board reports, their block
        # is prepended (plus a blank line) to /tmp/pincher_reply.txt
        # here, so the record equals what Reply via bridge sends from
        # that same file. The reply part is trimmed so the whole stays
        # within the 4,000-char send cap the Think step applies.
        env:
          TG_VIA: ${{ github.event.client_payload.via }}
          TG_DRY_RUN: ${{ github.event.client_payload.dry_run }}
        run: |
          git config user.name "zero"
          git config user.email "zero@purplepincher.org"
          python3 - <<'PY'
          import os, pathlib, datetime
          stem = os.environ.get("CONV_STEM", "").strip()
          if not stem:
              stem = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H%M%SZ")
          reply = pathlib.Path("/tmp/pincher_reply.txt").read_text().strip()
          blockf = pathlib.Path("/tmp/reports_block.txt")
          block = blockf.read_text().strip() if blockf.exists() else ""
          replaced = False
          if block and ("while you were away" in reply.lower() or "loop finished" in reply.lower()):
              # v0.8.2 gate: the reports block is the workflow's voice,
              # never the model's. A reply that imitates it (the live
              # acceptance failure - it arrived with an invented
              # outcome attached) is replaced whole; the incident is
              # noted in the output header below. Deterministic string
              # check, applied only when a block is being attached.
              reply = "That's everything my loop has reported. Ask me about anything else and I'll answer from my record."
              replaced = True
          if block:
              reply = block + "\n\n" + reply[:max(0, 4000 - len(block) - 2)]
              pathlib.Path("/tmp/pincher_reply.txt").write_text(reply)
          at = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          outdir = pathlib.Path("conversation/outputs")
          outdir.mkdir(parents=True, exist_ok=True)
          via = os.environ.get("TG_VIA") or "telegram"
          notes = []
          if os.environ.get("TG_DRY_RUN") == "true":
              notes.append("dry-run test - recorded, not delivered")
          if replaced:
              notes.append("voice reply replaced - it imitated the reports block (v0.8.2 gate)")
          note = ("note: " + "; ".join(notes) + "\n") if notes else ""
          header = f"---\nfrom: zero\nat: {at}\nvia: {via}\nturn: {stem}\nin-reply-to: inputs/{stem}.md\n{note}---\n\n"
          (outdir / f"{stem}.md").write_text(header + reply + "\n")
          PY
          git add conversation/outputs
          git diff --staged --quiet || (git commit -m "telegram: reply (${CONV_STEM})" && git push)

      - name: Reply via bridge
        if: ${{ github.event.client_payload.dry_run != 'true' }}
        env:
          TG_CHAT: ${{ github.event.client_payload.chat_id }}
          TELEGRAM_BRIDGE_URL: ${{ vars.TELEGRAM_BRIDGE_URL }}
        run: |
          RESP=$(jq -n --argjson chat "$TG_CHAT" --arg text "$(cat /tmp/pincher_reply.txt)" \
            '{chat_id: $chat, text: $text}' | \
            curl -s -X POST ${TELEGRAM_BRIDGE_URL:-https://lobster-telegram-bridge.casey-digennaro.workers.dev}/send \
              -H "Content-Type: application/json" -d @-)
          echo "$RESP" | jq '{ok, error}'
          # A bridge rejection must FAIL this step (v0.8 ship-pass fix):
          # before this, an ok:false response still counted as success,
          # so Mark-delivered could consume board reports the human
          # never saw. jq -e exits non-zero unless .ok is exactly true.
          echo "$RESP" | jq -e '.ok == true' > /dev/null

      - name: Mark reports delivered
        # v0.8: consume the board reports this reply carried - move each
        # file named in /tmp/reports_list.txt from reports/pending/ to
        # reports/delivered/ (the permanent archive) and commit. Empty or
        # missing list -> no-op, no commit. Dry-run runs never consume
        # reports. success() is false for the rest of the job after any
        # failed step, so if Think failed and the fallback sent the
        # hiccup line instead, this step is skipped and the reports stay
        # pending for the next reply - intended; do not "fix" it.
        if: success() && github.event.client_payload.dry_run != 'true'
        run: |
          git config user.name "zero"
          git config user.email "zero@purplepincher.org"
          if [ ! -s /tmp/reports_list.txt ]; then
            echo "no board reports to mark delivered"
            exit 0
          fi
          mkdir -p reports/delivered
          moved=0
          while IFS= read -r f; do
            case "$f" in
              ""|*/*|.*) continue ;;
            esac
            if [ -f "reports/pending/$f" ]; then
              mv "reports/pending/$f" "reports/delivered/$f"
              moved=$((moved + 1))
            fi
          done < /tmp/reports_list.txt
          echo "board reports marked delivered: $moved"
          if [ "$moved" -gt 0 ]; then
            git add -A reports
            git diff --staged --quiet || (git commit -m "telegram: reports delivered (${CONV_STEM})" && git push)
          fi

      - name: Fallback reply if Think failed
        # v0.5.1: a failed Think step must never mean silence (the
        # v0.5 quoting bug did exactly that). Record + send the same
        # hiccup line the Think step uses for an empty LLM reply,
        # marked in its output file as a fallback. Runs only when an
        # earlier step failed.
        if: failure()
        env:
          TG_CHAT: ${{ github.event.client_payload.chat_id }}
          TELEGRAM_BRIDGE_URL: ${{ vars.TELEGRAM_BRIDGE_URL }}
          TG_DRY_RUN: ${{ github.event.client_payload.dry_run }}
        run: |
          git config user.name "zero"
          git config user.email "zero@purplepincher.org"
          printf '%s' "Hmm, my brain hiccuped. Try again in a minute." > /tmp/pincher_reply.txt
          python3 - <<'PY'
          import os, pathlib, datetime
          stem = os.environ.get("CONV_STEM", "").strip()
          if not stem:
              stem = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H%M%SZ")
          if (pathlib.Path("conversation/outputs") / f"{stem}.md").exists():
              # A reply is already recorded for this turn (the Think
              # step succeeded but a later step - e.g. the bridge
              # send - failed). The record stands: the hiccup line
              # must neither overwrite it nor be sent after it.
              pathlib.Path("/tmp/fallback_skip").write_text("recorded\n")
              print("fallback skipped: a reply is already recorded for this turn")
              raise SystemExit(0)
          reply = pathlib.Path("/tmp/pincher_reply.txt").read_text().strip()
          at = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          outdir = pathlib.Path("conversation/outputs")
          outdir.mkdir(parents=True, exist_ok=True)
          header = f"---\nfrom: zero\nat: {at}\nvia: telegram\nturn: {stem}\nin-reply-to: inputs/{stem}.md\nnote: fallback reply — the think step failed this turn\n---\n\n"
          (outdir / f"{stem}.md").write_text(header + reply + "\n")
          PY
          git add conversation/outputs
          git diff --staged --quiet || (git commit -m "telegram: reply (fallback — think step failed)" && git push)
          if [ ! -f /tmp/fallback_skip ]; then
            if [ "$TG_DRY_RUN" != "true" ]; then
              jq -n --argjson chat "$TG_CHAT" --arg text "$(cat /tmp/pincher_reply.txt)" \
                '{chat_id: $chat, text: $text}' | \
                curl -s -X POST ${TELEGRAM_BRIDGE_URL:-https://lobster-telegram-bridge.casey-digennaro.workers.dev}/send \
                  -H "Content-Type: application/json" -d @- | jq '{ok, error}'
          fi
          fi
