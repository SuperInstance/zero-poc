# telegram.yml — Telegram message handler
#
# Triggered by repository_dispatch from the Telegram bridge worker.
# Logs the message, thinks via the vault (ZAI), and replies in Telegram.
#
# Maintainer notes (2026-10-15, see docs/architecture.md "telegram.yml"):
# - Full path of a message: Telegram DM → bridge worker /webhook →
#   repository_dispatch("telegram_message") here → MEMORY.md log commit →
#   one vault LLM turn → bridge /send → Telegram reply. The agent never
#   touches the Telegram API or bot token; the bridge holds them.
# - Memory-first ordering is deliberate: the inbound message is committed
#   to MEMORY.md BEFORE replying, so a crash during the LLM call can't
#   lose it.
# - TASK ROUTING (v0.3): inbound messages are ALSO appended to TASKS.md
#   under "## Open" as `- [ ] (telegram <user>) <text[:200]>`, because
#   MEMORY.md entries age out of the think loop's 2000-char context
#   window while TASKS.md is read fresh every cycle. The think LLM triages
#   them like any other task. (Previously: MEMORY-only logging, which let
#   Telegram instructions silently evaporate — docs/maintenance-notes.md.)
# - The bridge URL fallback below is hardcoded; the override is the repo
#   variable TELEGRAM_BRIDGE_URL. Moving the bridge means updating both
#   (plus VAULT.md-style docs).

name: telegram

on:
  repository_dispatch:
    types: [telegram_message]

permissions:
  id-token: write
  contents: write
  issues: write

jobs:
  handle-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get OIDC token for vault
        # Step output (not $GITHUB_ENV) so the token reaches only the
        # "Think via vault" step below.
        id: oidc
        run: |
          OIDC_TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vault" \
            | jq -r '.value')
          echo "token=${OIDC_TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Log Telegram event
        # Memory-first: persist the inbound message before attempting any
        # reply, so LLM/bridge failures can't lose it. Commits and pushes
        # immediately (unlike think.yml, which batches at cycle end).
        # v0.3: also routes the message onto TASKS.md's "## Open" board —
        # see the TASK ROUTING note in the header. ALL client_payload
        # values reach the script through the environment (TG_TEXT,
        # TG_USER, TG_CHAT): ${VAR} expansion is never re-parsed as shell,
        # while ${{ ... }} interpolation into run: text WOULD be an
        # injection point (the payload originates outside GitHub).
        env:
          TG_TEXT: ${{ github.event.client_payload.text }}
          TG_USER: ${{ github.event.client_payload.username }}
          TG_CHAT: ${{ github.event.client_payload.chat_id }}
        run: |
          echo "Telegram message from ${TG_USER}"
          echo "Chat ID: ${TG_CHAT}"
          git config user.name "zero"
          git config user.email "zero@purplepincher.org"
          echo "- Telegram from ${TG_USER} at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> MEMORY.md
          python3 - <<'PY'
          import os, pathlib
          text = " ".join(os.environ.get("TG_TEXT", "").split())[:200]
          user = os.environ.get("TG_USER", "unknown")
          line = f"- [ ] (telegram {user}) {text}"
          p = pathlib.Path("TASKS.md")
          if p.exists():
              content = p.read_text()
              if "## Open" in content:
                  head, _, tail = content.partition("## Open")
                  content = head + "## Open\n" + line + "\n" + tail.lstrip("\n").removeprefix("<!-- Add tasks here -->").lstrip("\n")
              else:
                  content = content.rstrip("\n") + f"\n\n## Open\n{line}\n"
          else:
              content = f"# TASKS.md — Task Board\n\n## Open\n{line}\n"
          p.write_text(content)
          PY
          git add MEMORY.md TASKS.md
          git diff --staged --quiet || (git commit -m "telegram: message from ${TG_USER}" && git push)

      - name: Think via vault
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          TG_TEXT: ${{ github.event.client_payload.text }}
          TG_USER: ${{ github.event.client_payload.username }}
          VAULT_URL: ${{ vars.VAULT_URL }}
        run: |
          RESP=$(jq -n \
            --arg oidc "$OIDC_TOKEN" \
            --arg text "$TG_TEXT" \
            --arg user "$TG_USER" \
            '{
              oidc_token: $oidc,
              service: "llm",
              action: "complete",
              params: {
                messages: [
                  {role: "system", content: "You are a Purple Pincher, a git-agent living in this repo. You hear your human through Telegram. Reply briefly and plainly, in your own voice. No fluff, no throat-clearing."},
                  {role: "user", content: ("[" + $user + "]: " + $text)}
                ],
                max_tokens: 500
              }
            }' | curl -s -X POST ${VAULT_URL:-https://superinstance-vault.casey-digennaro.workers.dev}/proxy \
              -H "Content-Type: application/json" -d @-)
          echo "$RESP" | jq '{success, error}'
          REPLY=$(echo "$RESP" | jq -r '.result.content // empty')
          if [ -z "$REPLY" ]; then
            REPLY="Hmm, my brain hiccuped. Try again in a minute."
          fi
          printf '%s' "$REPLY" | head -c 4000 > /tmp/pincher_reply.txt
          echo "reply saved ($(wc -c < /tmp/pincher_reply.txt) bytes)"

      - name: Reply via bridge
        env:
          TG_CHAT: ${{ github.event.client_payload.chat_id }}
          TELEGRAM_BRIDGE_URL: ${{ vars.TELEGRAM_BRIDGE_URL }}
        run: |
          jq -n --argjson chat "$TG_CHAT" --arg text "$(cat /tmp/pincher_reply.txt)" \
            '{chat_id: $chat, text: $text}' | \
            curl -s -X POST ${TELEGRAM_BRIDGE_URL:-https://lobster-telegram-bridge.casey-digennaro.workers.dev}/send \
              -H "Content-Type: application/json" -d @- | jq '{ok, error}'
